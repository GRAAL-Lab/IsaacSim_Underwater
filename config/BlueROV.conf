        0.218, -0.218,  0.0,      # T6 front-right vertical
       -0.218,  0.218,  0.0,      # T7 rear-left vertical
       -0.218, -0.218,  0.0       # T8 rear-right vertical
    ];

    thruster_orientations_degrees: [
        0.0,   0.0, -45.0,   # T1 front-left horizontal
        0.0,   0.0,  45.0,   # T2 front-right horizontal
        0.0,   0.0,  45.0,   # T3 rear-left horizontal
        0.0,   0.0, -45.0,   # T4 rear-right horizontal

        0.0, -90.0,   0.0,   # T5 front-left vertical
        0.0, -90.0,   0.0,   # T6 front-right vertical
        0.0, -90.0,   0.0,   # T7 rear-left vertical
        0.0, -90.0,   0.0    # T8 rear-right vertical
    ];

    
};

